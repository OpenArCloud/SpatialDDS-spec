name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check spec consistency (active version)
        # Permanent gate for the active spec version: fails the build if a
        # literal ```idl block in the sections tree has drifted from its
        # canonical idl/v<ver> counterpart, or if any retired @MAJOR.MINOR /
        # stale /1.<old> profile identifier remains. Bump the version arg when
        # a new minor becomes active.
        run: ./scripts/check_spec_consistency.py 1.7

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-mermaid2-plugin pymdown-extensions

      - name: Prepare docs
        # All `SpatialDDS-<v>-full.md` files are now generated locally and
        # committed (see CONTRIBUTING / project memory). CI just expands
        # `{{include:...}}` placeholders into mkdocs_docs/ and renders.
        run: ./scripts/prepare_mkdocs.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Overlay landing page
        # Replace the MkDocs-generated site/index.html with the
        # custom overview HTML in site_overlay/, plus any image
        # assets it references (e.g., spatialdds-demo-screenshot.png).
        # MkDocs spec pages under /SpatialDDS-1.6-full/, /v1.6/, etc.
        # are unaffected.
        run: |
          if [ -d site_overlay ]; then
            cp -R site_overlay/. site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
