name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check spec consistency (active version)
        # Permanent gate for the active spec version: fails the build if a
        # literal ```idl block in the sections tree has drifted from its
        # canonical idl/v<ver> counterpart, or if any retired @MAJOR.MINOR /
        # stale /1.<old> profile identifier remains. Bump the version arg when
        # a new minor becomes active.
        run: ./scripts/check_spec_consistency.py 1.7

      - name: Check registered-types registry (active version)
        # Fails the build if a §3.3.2 registry row names an IDL type or QoS
        # profile that does not resolve. See scripts/check_registry.py.
        run: ./scripts/check_registry.py 1.7

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-mermaid2-plugin pymdown-extensions

      - name: Prepare docs
        # All `SpatialDDS-<v>-full.md` files are now generated locally and
        # committed (see CONTRIBUTING / project memory). CI just expands
        # `{{include:...}}` placeholders into mkdocs_docs/ and renders.
        run: ./scripts/prepare_mkdocs.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Overlay landing page
        # Replace the MkDocs-generated site/index.html with the
        # custom overview HTML in site_overlay/, plus any image
        # assets it references (e.g., spatialdds-demo-screenshot.png).
        # MkDocs spec pages under /SpatialDDS-1.6-full/, /v1.6/, etc.
        # are unaffected.
        run: |
          if [ -d site_overlay ]; then
            cp -R site_overlay/. site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  topic-construct-gate:
    # Advisory: constructs a CycloneDDS Topic for every generated Python type,
    # catching binding-incompatible sequence bounds (Finding 2). Runs `idlc -l
    # py`, which requires the CycloneDDS IDL Python backend (libcycloneddsidlpy)
    # in addition to the pip `cyclonedds` runtime. The pip wheel alone does not
    # ship that backend, so on a stock runner the gate SKIPs cleanly rather than
    # running — hence continue-on-error. When the backend is present it runs for
    # real and fails on any Topic that cannot be constructed. Does not gate
    # deploy.
    name: topic-construct-gate (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CycloneDDS Python runtime
        run: pip install cyclonedds
      - name: Run topic-construction gate
        run: ./scripts/check_topic_construct.py 1.7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
